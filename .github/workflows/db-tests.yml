name: Testes do banco

# Sobe um Supabase LOCAL e descartável (Docker) dentro do runner, aplica as migrations e roda:
#   1. pgTAP (supabase test db): RLS, isolamento, privilégios, integridade, saldo, convites, dinheiro.
#   2. Testes de integração via PostgREST/Auth e de concorrência (duas sessões).
# Nenhum segredo é usado: nada aqui toca o projeto hospedado. As chaves vêm do stack local.

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/integration/**'
      - 'vitest.integration.config.ts'
      - '.github/workflows/db-tests.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tests/integration/**'
      - 'vitest.integration.config.ts'
      - '.github/workflows/db-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db:
    name: Migrations, pgTAP e integração
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # CLI com versão FIXA (antes: setup-cli@v1, que é uma branch, com `version: latest`). Em 02/11/2026 a `latest`
      # virou a 3.0.0 e mudou o padrão de alvo (ver o comentário em supabase-migrations.yml); aqui fica a mesma linha
      # 2.x da produção, na última 2.x estável (dist-tag `v2.stable` do npm). Subir de versão = PR própria.
      # A v3 da action só tem a input `version` (a `github-token` da v1 saiu; não era usada aqui).
      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.1

      - name: Versões usadas
        run: |
          supabase --version | tee versions.log
          docker --version | tee -a versions.log

      - name: Subir o stack local (aplica as migrations)
        run: supabase start 2>&1 | tee supabase-start.log

      - name: Versão do PostgreSQL local
        run: |
          docker exec "$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n1)" \
            psql -U postgres -tAc "select version()" | tee -a versions.log

      - name: pgTAP (supabase test db)
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee pgtap.log

      - name: Configurar Node.js
        if: ${{ !cancelled() }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        if: ${{ !cancelled() }}
        run: npm ci

      - name: Testes de integração (PostgREST, Auth e concorrência)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          # Só as variáveis necessárias; a service_role NÃO é lida nem exportada.
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|PUBLISHABLE_KEY|DB_URL)=')"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-}"
          export SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-}"
          export SUPABASE_DB_URL="$DB_URL"
          npm run test:integration 2>&1 | tee integration.log

      - name: Resumo
        if: ${{ always() }}
        run: |
          {
            echo "## Testes do banco"
            echo
            echo '```'
            cat versions.log 2>/dev/null || true
            echo '```'
            echo "### pgTAP"
            echo '```'
            tail -n 40 pgtap.log 2>/dev/null || echo "(não executado)"
            echo '```'
            echo "### Integração"
            echo '```'
            tail -n 60 integration.log 2>/dev/null || echo "(não executado)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-testes-banco
          path: |
            versions.log
            supabase-start.log
            pgtap.log
            integration.log
          if-no-files-found: ignore

      - name: Parar o stack
        if: ${{ always() }}
        run: supabase stop --no-backup || true
