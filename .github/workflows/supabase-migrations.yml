name: Supabase — aplicar migrations (produção)

# Só roda quando o dono clica em "Run workflow" no GitHub (Actions → este workflow).
# Primeiro use o modo "simular": mostra quais migrations seriam aplicadas, sem mudar nada.
# Para aplicar de verdade: modo "aplicar" + digitar APLICAR na confirmação.
#
# Segredos do repositório (Settings → Secrets and variables → Actions), cadastrados pelo dono:
#   SUPABASE_ACCESS_TOKEN  token pessoal do Supabase (revogar depois de usar)
#   SUPABASE_DB_PASSWORD   senha do banco do projeto
# Nenhum dos dois é impresso no log; a service_role não é usada.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'simular (só lista) ou aplicar'
        type: choice
        options: [simular, aplicar]
        default: simular
      confirmacao:
        description: 'Para aplicar, digite APLICAR'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: supabase-producao
  cancel-in-progress: false

jobs:
  migrations:
    name: db push (${{ inputs.modo }})
    # Produção só recebe o que está no main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: vbhzilsqzzevaodqsenr
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Conferir pedido e segredos
        env:
          MODO: ${{ inputs.modo }}
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Cadastre os segredos SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD."; exit 1
          fi
          if [ "$MODO" = "aplicar" ] && [ "$CONFIRMACAO" != "APLICAR" ]; then
            echo "::error::Para aplicar, digite APLICAR no campo de confirmação."; exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ligar ao projeto
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Situação antes (local x remoto)
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"

      - name: Simular (nada é alterado)
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Aplicar
        if: inputs.modo == 'aplicar'
        run: supabase db push --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Situação depois
        if: inputs.modo == 'aplicar'
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
