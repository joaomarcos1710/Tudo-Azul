name: Supabase — aplicar migrations (produção)

# Só roda quando o dono clica em "Run workflow" no GitHub (Actions → este workflow).
# Primeiro use o modo "simular": mostra quais migrations seriam aplicadas, sem mudar nada.
# Para aplicar de verdade: modo "aplicar" + digitar APLICAR na confirmação.
#
# Segredos do repositório (Settings → Secrets and variables → Actions), cadastrados pelo dono:
#   SUPABASE_ACCESS_TOKEN  token pessoal do Supabase (revogar depois de usar)
#   SUPABASE_DB_PASSWORD   senha do banco do projeto
# Nenhum dos dois é impresso no log; a service_role não é usada.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'simular (só lista) ou aplicar'
        type: choice
        options: [simular, aplicar]
        default: simular
      confirmacao:
        description: 'Para aplicar, digite APLICAR'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: supabase-producao
  cancel-in-progress: false

jobs:
  migrations:
    name: db push (${{ inputs.modo }})
    # Produção só recebe o que está no main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: vbhzilsqzzevaodqsenr
    # Os segredos NÃO ficam no env do job: só os passos que falam com o Supabase os recebem (checkout, instalação da CLI e
    # "Versão da CLI" rodam sem nenhum segredo no ambiente).
    steps:
      - name: Conferir pedido e segredos
        env:
          MODO: ${{ inputs.modo }}
          CONFIRMACAO: ${{ inputs.confirmacao }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Cadastre os segredos SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD."; exit 1
          fi
          if [ "$MODO" = "aplicar" ] && [ "$CONFIRMACAO" != "APLICAR" ]; then
            echo "::error::Para aplicar, digite APLICAR no campo de confirmação."; exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # A CLI fica na linha 2.x (e não em "latest"): em 02/11/2026 a versão nova passou a tratar o banco LOCAL como padrão e
      # recusou `migration list --password` ("--password only applies to a linked project"), derrubando o workflow antes de
      # simular. O alvo também é dito explicitamente (--linked), para não depender do padrão de nenhuma versão.
      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.x

      - name: Versão da CLI (para o registro)
        run: supabase --version

      - name: Ligar ao projeto
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Situação antes (local x remoto)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Simular (nada é alterado)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Aplicar
        if: inputs.modo == 'aplicar'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Situação depois
        if: inputs.modo == 'aplicar'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
