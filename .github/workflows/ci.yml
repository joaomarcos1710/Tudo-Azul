name: CI

on:
  push:
    branches: [main]
  # Todo PR, qualquer que seja a base: PRs empilhados (ex.: sobre um branch de migration)
  # também precisam passar por typecheck, testes e build.
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Executar testes
        run: npm test

      - name: Build de produção
        run: npm run build
