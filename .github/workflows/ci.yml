name: CI

on:
  push:
    branches: [main]
  # Todo PR, qualquer que seja a base: PRs empilhados (ex.: sobre um branch de migration)
  # também precisam passar por typecheck, testes e build.
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Executar testes
        run: npm test

      - name: Build de produção
        run: npm run build

      # Dependências que vão para o app dos usuários: qualquer vulnerabilidade conhecida barra o PR.
      # (As de ferramentas de desenvolvimento são tratadas em PRs próprios, para não misturar com o app.)
      - name: Vulnerabilidades nas dependências de produção
        run: npm audit --omit=dev --audit-level=low
