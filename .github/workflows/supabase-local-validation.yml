name: Supabase local database validation

on:
  push:
    branches:
      - main
      - test/local-supabase-validation-2026-228
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-local-validation.yml"

permissions:
  contents: read

concurrency:
  group: supabase-local-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: PostgreSQL 17 migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start disposable local Supabase stack
        run: supabase start

      - name: Rebuild database from all migrations
        run: supabase db reset --local

      - name: Run database tests
        run: supabase test db --local

      - name: Stop disposable local stack
        if: always()
        run: supabase stop --no-backup
